; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:digit_prod]
platform = espressif32
board = adafruit_feather_esp32_v2  ; Digit only
; board = esp32doit-devkit-v1  ; Digit+FAERIE
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = true
build_flags =
	-D DIGIT
	; -D DEBUG
lib_deps =
	https://github.com/SHC-ASTRA/astra-embedded-lib#main
	handmade0octopus/ESP32-TWAI-CAN@^1.0.1
    https://github.com/Lynxmotion/LSS_Library_Arduino
	madhephaestus/ESP32Servo
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit SHT31 Library@^2.2.2

[env:digit_dev]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = true
build_flags =
	-D DIGIT
	; -D DEBUG
lib_deps =
	symlink://../../astra-embedded-lib
	handmade0octopus/ESP32-TWAI-CAN@^1.0.1
    https://github.com/Lynxmotion/LSS_Library_Arduino
	madhephaestus/ESP32Servo
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit SHT31 Library@^2.2.2
